name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ── 1. Go unit tests ─────────────────────────────────────────────────────────
  test:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The Go package embeds web/dist; we need at least an empty index.html
      # so the build constraint in assets.go is satisfied during tests.
      - name: Create stub web/dist for tests
        run: mkdir -p web/dist && touch web/dist/index.html web/dist/.gitkeep

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  # ── 2. Build the web UI and the linux/amd64 binary ──────────────────────────
  build:
    name: Build (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Build web UI
        run: npm run build
        working-directory: web

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build linux/amd64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" \
            -o bin/agenthost ./cmd/agenthost

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agenthost-linux-amd64
          path: bin/agenthost
          retention-days: 30

  # ── 3. Build & test the Docker image ─────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image (runtime-web target)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          target: runtime-web
          tags: agenthost:ci-web
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build node image (runtime-node target)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          target: runtime-node
          tags: agenthost:ci-node
          cache-from: type=gha
          platforms: linux/amd64

      - name: Smoke-test web container
        run: |
          docker run --rm -d \
            -e AGENTHOST_AUTH=none \
            -e AGENTHOST_LOCAL_NODE=off \
            -p 18080:8080 \
            --name agenthost_ci_web \
            agenthost:ci-web
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18080/healthz; then
              echo "web: healthy"; break
            fi
            sleep 1
          done
          docker stop agenthost_ci_web

      - name: Smoke-test node container (codex present)
        run: |
          docker run --rm agenthost:ci-node \
            sh -c "codex --version && echo 'codex OK'"
