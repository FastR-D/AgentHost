version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    # The current PostCSS configuration uses Tailwind 3; v4 needs a separate migration.
    ignore:
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
