services:
  agenthost:
    build: .
    # AgentHost runs inside an ubuntu:24.04 dev container.
    # Codex CLI tasks execute directly in this container — no extra sidecar needed.
    ports:
      - "8080:8080"
    environment:
      # AGENTHOST_TOKEN: change-me          # default: generated and printed in the logs
      # OPENAI_API_KEY: sk-...              # passed through to Codex if using an API key
      AGENTHOST_SANDBOX: workspace-write    # read-only | workspace-write | danger-full-access
    volumes:
      - ./data:/data                        # agenthost state (sessions, runs, tokens)
      - ./workspace:/workspace              # task working directory
      - ~/.codex:/root/.codex               # Codex login / config.toml
    restart: unless-stopped
