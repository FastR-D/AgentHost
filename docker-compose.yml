services:
  agenthost:
    build: .
    ports:
      - "8080:8080"
    environment:
      # AGENTHOST_TOKEN: change-me    # default: generated and printed in the logs
      # AGENTHOST_AUTH: none          # disable auth (trusted networks only)
      AGENTHOST_LOCAL_NODE: "off"     # tasks run on remote node containers, not here
    volumes:
      - ./data:/data
    restart: unless-stopped
