services:
  agenthost:
    build:
      context: .
      target: runtime-web    # lightweight: no Codex CLI, no Node.js, no dev tools
    ports:
      - "8080:8080"
    environment:
      # AGENTHOST_TOKEN: change-me    # default: generated and printed in the logs
      # AGENTHOST_AUTH: none          # disable auth (trusted networks only)
      AGENTHOST_LOCAL_NODE: "off"     # all tasks run on remote node containers
    volumes:
      - ./data:/data                  # sessions, runs, tokens
    restart: unless-stopped
