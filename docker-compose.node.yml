# Dev container 节点：每个容器就是一个独立的开发环境，
# 代码和工作目录全在容器内，主动拨号到公网 Web 控制台。
# 不暴露端口，可放在 NAT / 防火墙后面。
# 一台服务器可以起多个容器，每个用不同的 AGENTHOST_NODE_NAME 区分。
#
# 用法：
#   1. 公网 Web 控制台 → 「服务器」页 → 拿节点令牌
#   2. 填写下面的 AGENTHOST_HUB / AGENTHOST_NODE_TOKEN / AGENTHOST_NODE_NAME
#   3. docker compose -f docker-compose.node.yml up -d
#
# 多个节点：复制 agenthost-node 块，改不同的 container_name 和 NODE_NAME 即可。

services:
  agenthost-node:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: agenthost-node-1
    environment:
      AGENTHOST_HUB: https://agenthost.example.com   # 公网 Web 控制台地址
      AGENTHOST_NODE_TOKEN: change-me                # 控制台「服务器」页给节点发的令牌
      AGENTHOST_NODE_NAME: "dev-1"                   # 显示在服务器列表里的名字
      AGENTHOST_SANDBOX: workspace-write
    # 不映射端口，不挂载宿主目录：容器即开发环境，数据全在容器内
    restart: unless-stopped
